name: Deploy to GitHub Pages

# Adapted from nfsmw-nx-installer by StevensND (GPL-3.0).
# The NRO is not in this repository: it is an asset of a release of R-drg/the-simpsons-game-nx. Each deployment downloads it
# into release/, checks it against release/manifest.json and publishes the page with it. Run it by hand
# (Actions > Deploy to GitHub Pages > Run workflow) after publishing a new release there.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Release of R-drg/the-simpsons-game-nx to take the NRO from (empty for the latest)
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Test the package code
        run: node test/package_node.mjs

      - name: Download the NRO of the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release download $TAG --repo R-drg/the-simpsons-game-nx --pattern 'the_simpsons_game.nro' --dir release --clobber

      - name: Check it against the list of builds
        run: node .github/verify_release.mjs

      - name: Assemble the site
        run: |
          mkdir _site
          cp -r index.html app.js worker.js sw.js cover.webp favicon.png fonts lib release _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
